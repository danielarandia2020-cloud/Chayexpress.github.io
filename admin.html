<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Panel Admin — CHAY Express</title>

	<link rel="icon" href="../img/isotipo.png">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
	<link href="../css/estilos.css" rel="stylesheet">
</head>
<body class="bg-light">
	<nav class="navbar navbar-chay">
		<div class="container">
			<span class="navbar-brand">
				<img src="../img/isotipo.png"> CHAY Express · Admin
			</span>
			<div>
				<a href="index.html" class="btn btn-sm btn-outline-secondary me-2">Sitio</a>
				<button id="adminLogout" class="btn btn-sm btn-outline-danger">Salir</button>
			</div>
		</div>
	</nav>

	<main class="container py-4">
		<div id="adminAlert"></div>

		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h1 class="h3">Dashboard</h1>
				<p class="text-muted mb-0">Operación de CHAY Express</p>
			</div>
			<button class="btn btn-outline-primary" onclick="cargarTodo()">↻ Actualizar</button>
		</div>

		<div class="row g-3 mb-4" id="stats"></div>

		<ul class="nav nav-tabs" id="adminTabs">
			<li class="nav-item">
				<button class="nav-link active" data-bs-toggle="tab" data-bs-target="#inventario">📦 Inventario</button>
			</li>
			<li class="nav-item">
				<button class="nav-link" data-bs-toggle="tab" data-bs-target="#pedidos">📑 Pedidos</button>
			</li>
			<li class="nav-item">
				<button class="nav-link" data-bs-toggle="tab" data-bs-target="#clientes">👥 Clientes</button>
			</li>
		</ul>

		<div class="tab-content bg-white p-3 shadow-sm">
			<div class="tab-pane fade show active" id="inventario">
				<div class="row g-4">
					<div class="col-lg-4">
						<h2 class="h5">Nuevo producto</h2>
						<form id="formProducto">
							<input id="pNombre" class="form-control mb-2" placeholder="Nombre" required>
							<select id="pCategoria" class="form-select mb-2" required></select>
							<textarea id="pDescripcion" class="form-control mb-2" placeholder="Descripción" required></textarea>
							<input id="pPrecio" type="number" min="0" class="form-control mb-2" placeholder="Precio" required>
							<input id="pImagen" class="form-control mb-2" placeholder="Ruta de imagen opcional">
							<input id="pImagenArchivo" type="file" accept="image/jpeg,image/png,image/webp" class="form-control mb-2">

							<div class="form-check form-switch mb-2">
								<input id="pActivo" class="form-check-input" type="checkbox" checked>
								<label class="form-check-label">Disponible</label>
							</div>

							<button class="btn btn-primary w-100">Crear producto</button>
						</form>

						<hr>

						<h2 class="h5">Nueva categoría</h2>
						<form id="formCategoria">
							<input id="cNombre" class="form-control mb-2" placeholder="Nombre" required>
							<input id="cImagen" class="form-control mb-2" placeholder="Ruta de imagen">
							<button class="btn btn-outline-primary w-100">Crear categoría</button>
						</form>
					</div>

					<div class="col-lg-8">
						<div class="table-responsive">
							<table class="table align-middle">
								<thead>
									<tr>
										<th>Producto</th>
										<th>Categoría</th>
										<th>Precio</th>
										<th>Estado</th>
										<th></th>
									</tr>
								</thead>
								<tbody id="productosBody"></tbody>
							</table>
						</div>
					</div>
				</div>
			</div>

			<div class="tab-pane fade" id="pedidos">
				<div class="table-responsive">
					<table class="table align-middle">
						<thead>
							<tr>
								<th>#</th>
								<th>Cliente</th>
								<th>Total</th>
								<th>Pago</th>
								<th>Estado</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody id="pedidosBody"></tbody>
					</table>
				</div>
			</div>

			<div class="tab-pane fade" id="clientes">
				<div class="table-responsive">
					<table class="table align-middle">
						<thead>
							<tr>
								<th>Cliente</th>
								<th>Contacto</th>
								<th>Pedidos</th>
								<th>Total comprado</th>
								<th>Puntos</th>
							</tr>
						</thead>
						<tbody id="clientesBody"></tbody>
					</table>
				</div>
			</div>
		</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="../js/api.js"></script>
	<script src="../js/admin.js"></script>
</body>
</html>
