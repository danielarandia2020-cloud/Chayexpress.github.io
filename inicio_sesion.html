<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — CHAY Express</title>
    <link rel="icon" href="../img/isotipo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-chay">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="../img/isotipo.png" alt="Isotipo CHAY Express">
            <span>CHAY Express</span>
        </a>
    </div>
</nav>

<main class="pagina-formulario flex-grow-1">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-6 col-lg-4">
                <div class="card card-formulario p-4">
                    <h1 class="h4 text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión</h1>
                    <form id="formularioLogin" method="POST" action="#">
                        <div class="mb-3">
                            <label for="usuario" class="form-label fw-bold">Usuario o Correo</label>
                            <div class="input-group input-icon-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Escribe tu usuario" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="contrasena" class="form-label fw-bold">Contraseña</label>
                            <div class="input-group input-icon-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="Escribe tu contraseña" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>

                    <div id="mensaje" class="mensaje mt-3" role="status"></div>

                    <a href="registro.html" class="enlace"><i class="bi bi-person-plus"></i> ¿No tienes cuenta? Regístrate aquí</a>
                    <a href="index.html" class="enlace"><i class="bi bi-arrow-left"></i> Volver al Inicio</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer-chay text-center">
    <div class="container">
        <p class="mb-1">📍 Bogotá, Colombia (Diana Turbay) | 📞 300 123 4567 | ✉️ contacto@chayexpress.com</p>
        <p class="mb-0">© 2026 CHAY Express — Rico. Rápido. A tu manera.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/api.js"></script><script src="../js/login.js"></script>
</body>
</html>
